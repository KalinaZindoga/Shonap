<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>My Shona App</ion-title>
</ion-toolbar>
</ion-header>
<ion-content class="all" [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">My Shona App </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-progress-bar class="bar" [value]="progress / 100"></ion-progress-bar>
      <p class="text-center">{{ progress }}% completed</p>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Level 1  </ion-card-title>
      <ion-card-subtitle>Stages  Category:EASY</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <div *ngFor="let i of level1">
        <ion-button
       
        expand="block" 
        [disabled]="check(1,i.stage)"
        [routerLink]="'/pages/play/'+1+'/'+i.stage"
        >
          Stage {{i.stage}}</ion-button>
          
      </div>
    </ion-card-content>
   </ion-card>


   <ion-card>
    <ion-card-header>
      <ion-card-title>Level 2      </ion-card-title>
      <ion-card-subtitle>Stages  Category:MEDIUM </ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <div *ngFor="let i of level2">
        <!--  -->
        <ion-button
        expand="block" 
        [disabled]="check(2,i.stage)"
        [routerLink]="'/pages/play/'+2+'/'+i.stage"
        >
          Stage {{i.stage}}</ion-button>
          
      </div>
    </ion-card-content>

   </ion-card>

   <ion-card>
    <ion-card-header>
      <ion-card-title>Level 3  
      </ion-card-title>
      <ion-card-subtitle>Stages  Category:HARD</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <div *ngFor="let i of level3">
        
        <div *ngIf="currentStage >=i.stage" class="unlocked">
      
        </div>
            <ion-button expand="block" [disabled]="true">Stage {{i.stage}}</ion-button> 
          </div>
        </ion-card-content>

   </ion-card>

 <!-- <ion-button expand="block" routerLink="/pages/play" class="play">PLAY</ion-button>  -->
  
</ion-content>
